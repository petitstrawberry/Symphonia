[package]
name = "symphonia-common"
description = "Project Symphonia utilities for codecs and formats."
authors = ["Philip Deljanov <philip.deljanov@gmail.com>"]
readme = "README.md"
categories = ["multimedia", "multimedia::audio", "multimedia::encoding"]
keywords = ["audio", "multimedia", "media", "xiph"]
# Common package metadata located in workspace Cargo.toml.
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
log = { version = "0.4", default-features = false }
symphonia-core = { version = "0.6.0", path = "../symphonia-core", default-features = false }
std = { package = "symphonia-std", version = "0.6.0", path = "../symphonia-std" }

[lints]
workspace = true
